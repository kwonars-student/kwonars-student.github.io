<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Homepage</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    .container {
      max-width: 720px;
      margin: 80px auto;
      padding: 40px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-bottom: 12px;
    }

    p {
      line-height: 1.7;
      color: #555;
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 20px;
      background: #222;
      color: white;
      text-decoration: none;
      border-radius: 8px;
    }

    a:hover {
      background: #444;
    }
  </style>
</head>

<body>
  <main class="container">
    <h1>Hello 👋</h1>

    <p>
      I'm a researcher.<br>
      Welcome.
    </p>

    <a href="https://github.com/">
      GitHub Link
    </a>
  </main>
</body>
</html>
